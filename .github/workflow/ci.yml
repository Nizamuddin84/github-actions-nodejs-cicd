name: Node.js CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout source code
         uses: actions/checkout@v4

       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
           node-version: 22

       - name: Check applicatoion syntax
         run: node --check app.js

       - name: Build Docker image
         run: docker build -t
nodejs-cicd-app:altest .
       - name: Verify Docker image
         run: docker image inspect
nodejs-cicd-app:latest
       - name: Run application container
         run: |
           docker run -d \
             --name nodejs-cicd-test \
             -p 3000:3000
             nodejs.-cicd-app:latest

        - name: Test application response
          run: |
            for i in $(seq 1 15); do
              if curl --fail
http://localhost:3000; then
                echo "Application test passed"
                exit 0
              fi
              sleep 2
            done
            echo "Application test failed"
            docker logs nodejs-cicd-test
            exit 1
    
