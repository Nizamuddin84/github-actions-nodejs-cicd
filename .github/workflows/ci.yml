name: Node.js CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check application syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build -t nodejs-cicd-app:latest .

      - name: Run application container
        run: |
          docker run -d \
            --name nodejs-cicd-test \
            -p 3000:3000 \
            nodejs-cicd-app:latest

      - name: Test application
        run: |
          for i in $(seq 1 15); do
            if curl --fail http://localhost:3000; then
              echo "Application test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs nodejs-cicd-test
          exit 1

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: nizamuddin112
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker tag nodejs-cicd-app:latest nizamuddin112/nodejs-cicd-app:latest
          docker push nizamuddin112/nodejs-cicd-app:latest
